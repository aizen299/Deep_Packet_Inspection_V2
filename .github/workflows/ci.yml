name: CI

# Render auto-deploys this repo's main branch, so a green run here is the only
# gate between a push and production.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: C++ engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libpcap-dev

      - name: Build
        run: cd backend && chmod +x build.sh && ./build.sh

      - name: Generate a capture and run the engine
        run: |
          python3 generate_test_pcap.py
          ./backend/build/bin/dpi_engine test_dpi.pcap /tmp/filtered.pcap --json > /tmp/report.json

      - name: Check the JSON contract the API depends on
        # A shape change here silently breaks server.js and the dashboard;
        # nothing type-checks across the subprocess boundary.
        run: |
          python3 - <<'PY'
          import json, sys
          r = json.load(open("/tmp/report.json"))
          required = {
              "packet_stats": ["total_packets", "total_bytes", "tcp_packets", "udp_packets"],
              "filtering": ["forwarded", "dropped", "drop_rate"],
              "fast_path": ["active_connections"],
          }
          for section, fields in required.items():
              if section not in r:
                  sys.exit(f"missing section: {section}")
              for f in fields:
                  if not isinstance(r[section].get(f), (int, float)):
                      sys.exit(f"{section}.{f} missing or not numeric")
          if not isinstance(r.get("applications"), dict):
              sys.exit("missing applications")
          print("engine JSON contract OK:", r["packet_stats"])
          PY

  api:
    name: Control plane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/api/package-lock.json

      - run: npm ci
        working-directory: backend/api

      - run: npm test
        working-directory: backend/api

      - name: Refuse to start unauthenticated
        # API_KEY unset must exit rather than serve every endpoint openly.
        working-directory: backend/api
        run: |
          set +e
          output=$(API_KEY= node server.js 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -eq 0 ]; then
            echo "::error::server started without API_KEY"
            exit 1
          fi
          echo "$output" | grep -q "API_KEY is unset" || {
            echo "::error::exited without explaining why"; exit 1; }

  ml:
    name: ML scorer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/ml/requirements.txt

      - run: pip install -r requirements.txt
        working-directory: backend/ml

      - run: python -m unittest discover -p 'test_*.py' -v
        working-directory: backend/ml

      - name: Refuse to start unauthenticated
        working-directory: backend/ml
        run: |
          set +e
          output=$(API_KEY= python -c "import server" 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -eq 0 ]; then
            echo "::error::scorer imported without API_KEY"
            exit 1
          fi
          echo "$output" | grep -q "API_KEY is unset" || {
            echo "::error::failed for an unexpected reason"; exit 1; }

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci
        working-directory: dashboard

      - run: npx tsc --noEmit
        working-directory: dashboard

      - run: npm run lint
        working-directory: dashboard

      - run: npm run build
        working-directory: dashboard
        env:
          NEXT_TELEMETRY_DISABLED: "1"
