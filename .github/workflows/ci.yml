name: CI

# Render auto-deploys this repo's main branch, so a green run here is the only
# gate between a push and production.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: C++ engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libpcap-dev

      - name: Build
        run: cd backend && chmod +x build.sh && ./build.sh

      - name: Generate a capture and run the engine
        run: |
          python3 generate_test_pcap.py
          ./backend/build/bin/dpi_engine test_dpi.pcap /tmp/filtered.pcap --json > /tmp/report.json

      - name: Check the JSON contract the API depends on
        # A shape change here silently breaks server.js and the dashboard;
        # nothing type-checks across the subprocess boundary.
        run: |
          python3 - <<'PY'
          import json, sys
          r = json.load(open("/tmp/report.json"))
          required = {
              "packet_stats": ["total_packets", "total_bytes", "tcp_packets", "udp_packets"],
              "filtering": ["forwarded", "dropped", "drop_rate"],
              "fast_path": ["active_connections"],
          }
          for section, fields in required.items():
              if section not in r:
                  sys.exit(f"missing section: {section}")
              for f in fields:
                  if not isinstance(r[section].get(f), (int, float)):
                      sys.exit(f"{section}.{f} missing or not numeric")
          if not isinstance(r.get("applications"), dict):
              sys.exit("missing applications")
          print("engine JSON contract OK:", r["packet_stats"])
          PY

  fuzz:
    name: Extractor fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build and generator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libpcap-dev
          pip install -r requirements-dev.txt

      - name: Build with AddressSanitizer and UBSan
        run: cd backend && chmod +x build.sh && ./build.sh asan

      - name: Confirm the sanitizer is actually armed
        # A clean fuzz run proves nothing if the instrumentation is missing, so
        # fail loudly here rather than reporting a false all-clear below.
        run: |
          cat > /tmp/canary.cpp <<'CPP'
          #include <cstdint>
          #include <cstdio>
          int main() {
              uint8_t buf[8] = {0};
              volatile uint8_t x = buf[9];
              printf("%d\n", x);
              return 0;
          }
          CPP
          c++ -fsanitize=address,undefined -fno-omit-frame-pointer -g -o /tmp/canary /tmp/canary.cpp
          if /tmp/canary > /dev/null 2>/tmp/canary.err; then
            echo "::error::canary did not trap - sanitizer is not armed"
            exit 1
          fi
          grep -q "AddressSanitizer" /tmp/canary.err || {
            echo "::error::canary failed for an unexpected reason"
            cat /tmp/canary.err
            exit 1; }
          echo "sanitizer confirmed armed"

      - name: Fuzz the protocol extractors
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          status=0
          for seed in 1 7 42 1337 90210; do
            python3 generate_fuzz_pcap.py --out /tmp/fz.pcap --count 12000 --seed "$seed" >/dev/null
            if ! ./backend/build-asan/bin/dpi_engine /tmp/fz.pcap /tmp/out.pcap --json \
                 >/dev/null 2>/tmp/fz.err; then
              echo "::error::engine failed on seed $seed"
              tail -40 /tmp/fz.err
              status=1
              continue
            fi
            if grep -qiE "AddressSanitizer|runtime error" /tmp/fz.err; then
              echo "::error::sanitizer finding on seed $seed"
              grep -iE "AddressSanitizer|runtime error|SUMMARY" /tmp/fz.err | head -20
              status=1
              continue
            fi
            echo "seed $seed: clean"
          done
          exit $status

  api:
    name: Control plane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/api/package-lock.json

      - run: npm ci
        working-directory: backend/api

      - run: npm test
        working-directory: backend/api

      - name: Refuse to start unauthenticated
        # API_KEY unset must exit rather than serve every endpoint openly.
        working-directory: backend/api
        run: |
          set +e
          output=$(API_KEY= node server.js 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -eq 0 ]; then
            echo "::error::server started without API_KEY"
            exit 1
          fi
          echo "$output" | grep -q "API_KEY is unset" || {
            echo "::error::exited without explaining why"; exit 1; }

  ml:
    name: ML scorer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/ml/requirements.txt

      - run: pip install -r requirements.txt
        working-directory: backend/ml

      - run: python -m unittest discover -p 'test_*.py' -v
        working-directory: backend/ml

      - name: Refuse to start unauthenticated
        working-directory: backend/ml
        run: |
          set +e
          output=$(API_KEY= python -c "import server" 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -eq 0 ]; then
            echo "::error::scorer imported without API_KEY"
            exit 1
          fi
          echo "$output" | grep -q "API_KEY is unset" || {
            echo "::error::failed for an unexpected reason"; exit 1; }

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci
        working-directory: dashboard

      - run: npx tsc --noEmit
        working-directory: dashboard

      - run: npm run lint
        working-directory: dashboard

      - run: npm run build
        working-directory: dashboard
        env:
          NEXT_TELEMETRY_DISABLED: "1"
